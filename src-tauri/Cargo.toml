[package]
name = "ia_workspaces"
version = "1.1.0"
description = "ia_workspaces, hosted by Tauri"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WezTerm's pty crate: ConPTY on Windows, openpty elsewhere, one API. The
# closest thing Rust has to node-pty, and better tested on Windows.
portable-pty = "0.8"
dirs = "5"

[profile.release]
# The port exists to use less memory than Electron; a binary optimised for size
# is also the one that pages in fastest on a machine that is already short.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
